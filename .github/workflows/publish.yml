# Publish to GitHub Packages on push to main.
# Version comes from package.json (manual bump). Skips if that version already exists.
# Uses GITHUB_TOKEN only. If 403 write_package: Package settings → Manage Actions
# access must include this repo, and Actions → General → Workflow permissions
# must be "Read and write permissions".

name: Publish package

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip publish]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@neptune-software"

      - name: Configure npm for GitHub Packages
        run: |
          echo "@neptune-software:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Publish if new version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@neptune-software/dxp-e2e-toolbox@${VERSION}" version >/dev/null 2>&1; then
            echo "Already published ${VERSION}, skip"
          else
            npm publish
          fi
